[package]
name = "docsgraph-desktop"
version = "0.0.0"
description = "docsgraph desktop shell (Tauri wrapper around apps/web)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
